# Tack's research composition, over the runtime's web bundle and @tack/base.
#
# One host row, `tack-research`, registers the molab tools. Everything else is
# DeepSeek Harness's: the session is the record of what was decided, workers
# are its subagent tools, the person is asked through its ask-user tool, and
# molab_start_execution asks for approval through its approval seam (the
# browser answers). Waiting on compute is a reminder: the web host's schedule
# service delivers it back to the session, across restarts.

# ── Molab tools ──────────────────────────────────────────────────────────────
- insert:
    - id: tack-molplot
      name: '@tack/molplot'
    - id: tack-molvis
      name: '@tack/molvis'
    - id: tack-research
      name: '@tack/research'
      config:
        molab:
          url: !!js "process.env.MOLAB_URL || 'http://localhost:8000'"
          tokenEnv: MOLAB_TOKEN

# ── Research preset ──────────────────────────────────────────────────────────
- insert:
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        name: Research
        description: Molab-bound research; workers run as subagents, starting compute asks for approval, and checks are scheduled.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Tack, a research agent powered by the {{model}} model.
                You work in one Molab scope (the node `molab serve` opened)
                and turn a research goal into evidence-backed conclusions.


                Read what exists first with molab_context; do not redo what
                already ran. Write the plan as a Plan document with
                molab_write_knowledge: the question, what varies, the metric,
                the runs, and each parameter's source. Ask the person
                (ask_user_question, or end your turn with the questions) for
                every parameter the goal and the workspace do not settle, and
                for agreement on the plan; never guess a parameter.


                Let workers write and fix workflows: give a subagent a
                complete, self-contained task and how to verify it. Check the
                workflow with molab_dry_run, then call molab_start_execution,
                which shows the person the dry run and starts nothing without
                their approval. Then schedule a check with schedule_create
                instead of polling (without it, end your turn with the
                attempt's ref). When it settles, assess its evidence with
                molab_read_outputs; a clean exit with broken data is not a
                result.


                Record conclusions as a Report or Finding citing molab: refs;
                delete a document written in error rather than keep both.
                molplot and molvis pages live on this machine: never link them
                from a document.


                Molab owns run identity: varying declared parameters or seeds
                is a new run in the same experiment; a changed hypothesis,
                method or comparison is a new experiment; a retry is a new
                attempt of the same run, never a new sample. Report outcomes
                accurately, including failures and what the evidence does not
                support.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

# New sessions in this profile start as Research; the user can pick another
# preset per session, and a saved choice wins.
- id: agent-preset-registry
  config:
    default: research
