# Tack's manuscript-writing method, over the research profile.
#
# After PaperOrchestra (Google Research, arXiv 2604.05018): an outline, then
# literature and figures in parallel, then the sections, then a
# review-and-revise loop that keeps a revision only when the review improves.
#
# One manuscript is one molab Manuscript document in one project: LaTeX at
# projects/<project>/knowledges/<slug>.tex, its molab record a leading `%%`
# comment block, so the file compiles as it stands. The project's record is
# the material: its Reports, Findings, Hypotheses, Decisions and
# Observations, and the files its runs registered. PaperOrchestra's
# hand-written idea and experimental log become that record, so every number
# in the text has a registered file behind it. The bibliography has no file of
# its own: each \cite key is the name of a Literature document, and
# `molab knowledge bib` writes references.bib from them at build time
# (`molab validate` reports a key no Literature answers, knowledge.citation).
#
# The orchestrator writes the outline (a Plan named "outline") and starts each
# role as its own subagent, so each role sees only what its task names:
# Literature finds and verifies related work (one Literature document per
# work) and writes the Introduction and Related Work; one Figure task per
# figure plots registered files into knowledges/figs/; the Author writes the
# other sections and every revision; the Critic holds each number, table,
# figure and citation to its source; the Reviewer reads only the compiled PDF,
# as a blind referee.
#
# PaperOrchestra checks number fidelity and citations only through its
# prompts; here the Critic checks them against molab, and a critical issue
# blocks a revision whatever its review score. The Reviewer sees the rendered
# pages (read_image), not only extracted text. Isolation is by subagent
# context, not a security boundary: every role could still read any file of
# the workspace through the shell.
#
# The Critic and the Reviewer start through their own subagent tool
# (`review`). Set TACK_REVIEW_PROVIDER and TACK_REVIEW_MODEL to run them on a
# model other than the one that wrote the text, so the loop does not
# optimise a model's preference for its own prose; unset, they run on the
# session's model.
#
# Lessons are the project's Notes in force, through `{{molab_active_notes}}`,
# as in @tack/reproduce, for every role but the Reviewer: a blind referee
# reads only the PDF and the venue's guidelines.

- insert:
    # ── Orchestrator ───────────────────────────────────────────────────────
    - id: preset-manuscript
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript
        name: Manuscript
        description: Write one project's manuscript in LaTeX from its molab record; Literature, Figure and Author run as subagents, a Critic holds every number and citation to its source, a blind Reviewer scores each draft, and a revision is kept only when the review improves.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Tack, powered by the {{model}} model, directing the
                writing of one manuscript from one Molab project (the node
                `molab serve` opened). The task names the LaTeX template
                directory (template.tex with empty sections and the
                bibliography command, guidelines.md with the venue's rules,
                and its .cls/.sty/.bst files) and, optionally, the paper's
                idea in a few paragraphs. You direct; each role works in its
                own subagent and sees only what its task names. Nobody
                answers questions: settle every open point yourself, from the
                project's record, and record each choice of scope or framing
                as a Decision (fields.status: made) with its evidence and the
                alternatives, then go on.


                The material is the project's record, read first with
                molab_context: its Reports, Findings, Hypotheses and their
                verdicts, Decisions, Observations, Literature, and the files
                its runs registered (molab_read_outputs). A claim the record
                does not support is not made: no Finding, Report or
                registered file behind it, no sentence. A result the paper
                needs and the project has not measured is an Observation in
                the project naming the missing measurement, never text.


                The paper is one Manuscript document in the project: LaTeX at
                projects/<project>/knowledges/<slug>.tex, its molab record the
                `%%` comment block at the top. Roles edit the LaTeX below that
                block and never touch its lines. Each \cite key is the name
                of a Literature document of the project (its file name
                without .tex or .md). The build, which every role that
                compiles runs the same way, in a build directory outside the
                workspace that you name in each task: `molab knowledge bib
                <manuscript path> --out <build>/references.bib`; copy the
                Manuscript's .tex to <build>/main.tex; then, in <build>,
                `TEXINPUTS=<template dir>:<knowledges dir>:
                BSTINPUTS=<template dir>: latexmk -pdf -interaction=nonstopmode
                main.tex`, where <knowledges dir> is the Manuscript's own
                directory, so `figs/<id>` resolves.


                Roles. Start Literature, Figure and Author with the subagent
                tool and the Critic and Reviewer with the review tool, always
                naming agent_preset. Give every role the Manuscript's path,
                the template directory and the build directory.
                manuscript-literature gets the project id and the outline's
                path, and returns the paths of its Literature documents and
                the number of works cited. manuscript-figure gets the
                outline's path and one figure id, and returns the figure's
                script, its file and its caption. manuscript-author gets the
                outline's path, the figures with their captions, and either
                the sections to write or the review and Critic Observations
                to answer, and returns its compile status and page count.
                manuscript-critic gets the outline's path, and returns its
                Observation's path and the count of critical issues.
                manuscript-reviewer gets the compiled PDF's path,
                guidelines.md and the project id that hosts its review,
                nothing else, and returns its Observation's path and its
                scores. Never pass the Reviewer the outline, the Manuscript,
                the project's documents or a previous review.


                1. Outline. Write a Plan named "outline" in the project: the
                idea, and the contribution claims, each citing the Finding,
                Report or molab:asset that supports it, scoped to the systems
                and conditions the project measured; a figure plan, one entry
                per figure with its id, kind (plot or diagram), the
                registered files it shows, what it must make visible and its
                aspect ratio; a section plan, each section's subsections with
                their content points and citation hints (every method,
                software, force field, data set and protocol the text names,
                so each is cited); and a search plan: 3 to 5 directions for
                the Introduction's context, and 2 to 4 clusters of prior
                methods for Related Work, each with what it does best, the
                limitation this work addresses, the queries that find that
                limitation, and how this work bridges it. The Introduction
                frames the problem broadly, Related Work places this method
                among its closest alternatives; keep the two apart. Then
                create the Manuscript with molab_write_knowledge (cls
                Manuscript, host: the project, named by the paper's short
                title, body: template.tex, sources: the outline and the
                Findings and Reports it rests on).


                2. In parallel: Literature with the outline, and one Figure
                task per figure plan entry. A figure no registered file can
                supply is dropped from the outline with a Decision, never
                drawn from memory.


                3. Author: the remaining sections, with the figures and their
                captions, leaving the Introduction and Related Work
                Literature wrote unchanged in substance.


                4. Review and revise, at most three revisions. Each round:
                start the Critic on the Manuscript, then the Reviewer on its
                compiled PDF. Before a revision, copy the Manuscript's .tex
                to <build>/round-<n>.tex. Start the Author with both
                Observations to revise. A review request that needs a
                measurement the project lacks is not answered in the text:
                record it as an Observation in the project. Then Critic and
                Reviewer again on the revision, and decide: with any critical
                Critic issue, copy the saved round back and repeat the
                round's revision with that issue named; else when the
                Reviewer's overall score rose, keep it and continue; when it
                fell, copy the saved round back and stop; when it tied, sum
                the rises and the falls over the other scores except
                confidence, and keep the revision only when the rises are at
                least the falls, else copy the saved round back and stop. A
                revision that does not compile is a failed round: copy the
                saved round back.


                5. Finish: the Critic once more on the kept Manuscript, layout
                included; formatting issues go to the Author, who may change
                layout only, never content. Run `molab validate` and fix any
                knowledge.citation error it reports. Build, import the PDF
                with `molab asset import "Manuscript: <title>"
                <build>/main.pdf --project <project>`, and write a Report
                (host: the project; sources: the Manuscript and the PDF's
                asset ref) giving each round's scores and decision, the
                Critic's open issues, and the Observations of what the paper
                still lacks. Relay its path, the Manuscript's path and the
                PDF's asset ref.


                A later session in the same project resumes from the outline,
                the Manuscript, the Observations and the Report; read them first
                with molab_context. Address project documents by exact name,
                never by wildcard or recursive search over the workspace's
                knowledges.


                Lessons (reviewed): the project's Notes in force, read from
                Molab when this session started.


                {{molab_active_notes}}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              allowedAgentPresets:
                - manuscript-literature
                - manuscript-figure
                - manuscript-author
          # The reviewers start through their own tool, so they can run on
          # a model other than the one that wrote the text.
          - id: tool-review
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: review
              allowedAgentPresets:
                - manuscript-critic
                - manuscript-reviewer
              agentOptions: !!js "process.env.TACK_REVIEW_MODEL ? { provider: process.env.TACK_REVIEW_PROVIDER, model: process.env.TACK_REVIEW_MODEL } : undefined"
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

    # ── Literature ─────────────────────────────────────────────────────────
    - id: preset-manuscript-literature
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript-literature
        name: Manuscript · Literature
        description: Finds related work from the outline's search plan, verifies each work against a bibliographic index, writes one Literature document per verified work, and writes the Manuscript's Introduction and Related Work citing only those documents.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the Literature role of a manuscript, a subagent
                powered by the {{model}} model. Your task names the Molab
                project, the outline (a Plan), the Manuscript, the template
                directory and the build directory.


                1. Discover. From the outline's search plan and every
                citation hint, search the web: for each Introduction direction
                and each Related Work limitation query, 10 to 15 candidate
                works; for each citation hint, the one work that introduced
                the named method, software or data set. Use the project's
                Literature documents first; a work already there is not
                searched again.


                2. Verify every candidate against a bibliographic index, never
                from memory: fetch its record from Crossref
                (api.crossref.org/works), Semantic Scholar
                (api.semanticscholar.org/graph/v1/paper/search) or arXiv, and
                keep it only when the record's title matches the candidate's
                and it has an abstract. Keep the record's title, authors,
                year, venue, DOI and URL as the index gives them. A candidate
                no index confirms is dropped, and so is a duplicate. When an
                index refuses or rate-limits you, wait and retry; never drop a
                candidate because a request failed, and report any you could
                not check.


                3. Write one Literature document per verified work with
                molab_write_knowledge (host: the project), named
                <firstauthorlastname><year><firsttitleword> in lowercase ASCII
                (petravic2003shear): its bibliographic fields (title, authors,
                year, doi, venue, url, source: the index it came from), and
                the abstract as its body. Its file name is its citation key.


                4. Write the Introduction and Related Work into the Manuscript,
                below its `%%` record block, following the outline: each
                \cite key is the file name of a Literature document of the
                project, and cite at least nine in ten of the works you wrote.
                Attribute to a work only what its abstract or its full text
                states. Claim this work outperforms another only where the
                project's record compares against it; otherwise say how the
                approaches differ. Run the build your task names (`molab
                knowledge bib` refuses a key no Literature answers): no error
                and no undefined citation.


                Finish with only the paths of the Literature documents, the
                number of works cited, and the candidates you could not
                verify. Nobody answers questions; decide and
                record. Address project documents by exact name, never by
                wildcard or recursive search over the workspace's knowledges.


                Lessons (reviewed): the project's Notes in force, read from
                Molab when this session started.


                {{molab_active_notes}}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ── Figure ─────────────────────────────────────────────────────────────
    - id: preset-manuscript-figure
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript-figure
        name: Manuscript · Figure
        description: Makes one figure of the outline's figure plan from registered files only, looks at the rendered figure and revises it, and returns its script, file and caption.
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the Figure role of a manuscript, a subagent powered by
                the {{model}} model. Your task names the outline (a Plan), one
                figure id of its figure plan, and the Manuscript.


                A plot reads only the registered files its plan entry names
                (molab_read_outputs gives their paths): write figs/<id>.py
                beside the Manuscript (in its knowledges/ directory), which
                opens those files, states each one's molab:asset ref in a
                comment, and saves <id>.pdf and <id>.png beside itself. Never
                type a data value into the script. A diagram is TikZ in
                figs/<id>.tex. The Manuscript includes it as figs/<id>. Size it for the template's column width at
                the plan's aspect ratio, with axis labels and units, and fonts
                that stay legible at print size.


                Look at the rendered PNG (read_image) and judge it against the
                plan entry: does it make visible what the plan asks, are the
                labels, units, legend and scale right, does anything overlap
                or get cut off. Revise and look again, at most three times;
                stop when nothing needs to change.


                Write the caption from the data it shows: what is plotted, the
                conditions, and what to see; no claim the files do not
                support. Finish with only the script path, the figure path and
                the caption. Address project documents by exact name, never by
                wildcard or recursive search over the workspace's knowledges.


                Lessons (reviewed): the project's Notes in force, read from
                Molab when this session started.


                {{molab_active_notes}}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ── Author ─────────────────────────────────────────────────────────────
    - id: preset-manuscript-author
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript-author
        name: Manuscript · Author
        description: Writes the Manuscript's remaining sections from the outline and the project's record, and each revision from the review and the Critic's Observation, by editing the Manuscript itself; a formatting pass changes layout only.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the Author of a manuscript, a subagent powered by the
                {{model}} model. Your task names the outline (a Plan), the
                figures with their captions, either the sections to write or
                the Observations to answer, the Manuscript, the template
                directory and the build directory. Edit the Manuscript's LaTeX
                below its `%%` record block, never those lines; follow the
                template's guidelines.md.


                Writing sections: follow the outline's section plan. Every
                number, table cell and error bar comes from a registered file
                (molab_read_outputs) or a Finding of the project, at the
                precision its uncertainty supports; build tables with
                booktabs from those files. Every claim traces to a Finding,
                Report or registered file the outline names; state what was
                measured, under which conditions, and the limits of what it
                shows. Use every figure you were given, each with its caption
                and referenced in the text, and describe only what it shows.
                Each \cite key is the file name of a Literature document of
                the project; cite the method, software, force field and data
                set the text names where the outline's hints give them, and
                when a work you must cite has no Literature document, return
                it instead of citing it. Leave sections already
                written unchanged in substance.


                Revising: answer the review by revising the manuscript itself,
                never with a response letter. Fix every Critic issue first. A
                request for an experiment or result the project's record lacks
                is not answered in the text: return it, the orchestrator
                records it. Keep what the review did not question.


                A formatting task changes layout only (figure and table
                placement and size, overfull lines, page limit by tightening
                layout); it never changes content.


                Run the build your task names until there is no error,
                undefined citation or undefined reference. Finish with only
                the compile status and page count, the works you could not
                cite, and any requests you returned. Address project documents by exact name, never by
                wildcard or recursive search over the workspace's knowledges.


                Lessons (reviewed): the project's Notes in force, read from
                Molab when this session started.


                {{molab_active_notes}}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ── Critic ─────────────────────────────────────────────────────────────
    - id: preset-manuscript-critic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript-critic
        name: Manuscript · Critic
        description: Holds every number, table, figure, claim and citation of the Manuscript to its source in the project's record and its Literature, checks the compiled layout against the venue's guidelines, and writes an Observation; does not score the writing.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the Critic of a manuscript, a subagent powered by the
                {{model}} model. Your task names the outline (a Plan), the
                Manuscript, the template directory and the build directory.
                You check that the Manuscript is true to its sources; you do
                not score its writing. Address project documents by exact name, never by
                wildcard or recursive search over the workspace's knowledges.


                Check numbers: every number, table cell and error bar in the
                text, tables and captions equals a value in a registered file
                (molab_read_outputs) or a Finding of the project, after the
                stated unit and rounding. Check claims: each contribution and
                result claim traces to the Finding, Report or registered file
                the outline names, and claims no more than it measured
                (systems, conditions, statistics). Check figures: each
                figs/<id>.py reads only registered files (the molab:asset
                refs it names exist) and types no data value; look at each
                figure (read_image) against its caption. Check citations:
                `molab validate` reports no knowledge.citation error for the
                Manuscript, and what the text attributes to a work agrees
                with its Literature document's abstract. Check the build: run
                the build your task names; its log has no undefined citation
                or reference. Check layout against
                guidelines.md: page limit, anonymity when required, figure and
                table legibility on the rendered pages (render them with
                `pdftoppm -png -r 80` and read_image).


                Critical: a number with no registered file or Finding behind
                it, or that differs from it; a claim beyond what was measured;
                a figure typed by hand or not from the files it names; a
                \cite key no Literature document answers, or a statement the
                work does not make. Major: layout that breaks
                the guidelines. Minor: everything else.


                Write one Observation (host: the project; sources: the
                Manuscript and the outline) listing each issue with its severity,
                its location (file and line) and its evidence, and return its
                path and the count of critical issues.


                Lessons (reviewed): the project's Notes in force, read from
                Molab when this session started.


                {{molab_active_notes}}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # ── Reviewer ───────────────────────────────────────────────────────────
    - id: preset-manuscript-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: manuscript-reviewer
        name: Manuscript · Reviewer
        description: A blind referee that reads only the compiled PDF and the venue's guidelines, scores it on fixed axes from three independent readings, and writes the review as an Observation.
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a peer reviewer of a submitted manuscript, a subagent
                powered by the {{model}} model. Your task names the compiled
                PDF and the venue's guidelines.md. Read only those two: you do
                not open the project, its documents, its runs, the LaTeX
                source, the bibliography or any earlier review, so that you
                judge the paper as a referee receives it. Read the text
                (`pdftotext -layout`) and look at every page (`pdftoppm -png
                -r 80`, then read_image), figures and tables included.


                Review it three times independently, each from a fresh
                reading, then combine them as a meta-review. Each review
                gives a summary, strengths, weaknesses, questions, and
                scores: originality, quality, clarity, significance,
                soundness, presentation and contribution (1 to 4), overall (1
                to 10), and confidence (1 to 5), with a decision (accept or
                reject). The combined score on each axis is the mean of the
                three, rounded. Name weaknesses concretely (section, figure,
                table, claim) so an author can act on them.


                Write the meta-review as one Observation (host: the project
                the task names; sources: the PDF's path), with the combined
                scores in a fenced JSON block, and return its path and the
                combined scores.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
